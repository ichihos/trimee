name: trimee
description: "旅行計画をみんなでワイワイ楽しむAIサポートアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_messaging: ^16.1.1
  firebase_ai: ^3.7.0

  # Google Maps
  google_maps_flutter: ^2.10.1

  # Mapbox
  mapbox_maps_flutter: ^2.2.0 #2.18.0がなさそうなので2.2.0に変更

  # Lottie Animation
  lottie: ^3.3.1

  # Export
  # ffmpeg_kit_flutter_min_gpl: ^5.1.0 # Temporarily disabled due to download issues
  path_provider: ^2.1.5
  pdf: ^3.11.2

  # Navigation
  go_router: ^14.8.1

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # Ads (for monetization)
  google_mobile_ads: ^5.3.1

  # In-App Purchases (RevenueCat)
  purchases_flutter: ^8.3.1

  # Social Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  uuid: ^4.5.2
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter_native_splash:
  color: "#FAF9F7"
  image: "assets/images/splash.png"
  android_12:
    image: "assets/images/splash.png"
    icon_background_color: "#FAF9F7"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: JosefinSans
      fonts:
        - asset: assets/fonts/JosefinSans-Regular.ttf
        - asset: assets/fonts/JosefinSans-Bold.ttf
          weight: 700
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
