<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trimee - 旅行に招待されました</title>
  <meta name="description" content="Trimeeで旅行プランをみんなで楽しもう">
  <!-- OGP for link previews -->
  <meta property="og:title" content="Trimeeで旅行に参加しよう">
  <meta property="og:description" content="友達があなたを旅行プランに招待しています。Trimeeアプリで参加しましょう！">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Trimee">
  <!-- Josefin Sans (app logo font) + Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #FAF9F7;
      color: #2D2D2D;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #C4785B;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-family: 'Noto Sans JP', sans-serif;
      color: #888;
      font-size: 14px;
      margin-bottom: 40px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .card p {
      color: #666;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 24px;
      border-radius: 12px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
      border: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: #C4785B;
      color: white;
      margin-bottom: 10px;
    }
    .btn-primary:hover { box-shadow: 0 4px 16px rgba(196,120,91,0.3); }
    .btn-web {
      background: #2D2D2D;
      color: white;
      margin-bottom: 10px;
    }
    .btn-web:hover { box-shadow: 0 4px 16px rgba(45,45,45,0.2); }
    .btn-secondary {
      background: #F0EDE8;
      color: #2D2D2D;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: #bbb;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E0DDD8;
    }
    .store-links {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }
    .store-links a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: #2D2D2D;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px;
      font-weight: 500;
    }
    .store-links a:hover { opacity: 0.9; }
    .footer {
      margin-top: 40px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">trimee</div>
    <div class="subtitle">旅行計画をみんなでワイワイ楽しむ</div>

    <div class="card">
      <h2>旅行に招待されました</h2>
      <p>友達があなたをTrimeeの旅行プランに招待しています。</p>
      <a class="btn btn-primary" id="openApp" href="#">アプリで開く</a>
      <a class="btn btn-web" id="openWeb" href="#">Webで続行する</a>
      <div class="divider">または</div>
      <a class="btn btn-secondary" id="copyId" href="#" onclick="copyTripId(event)">旅行IDをコピー</a>
    </div>

    <div class="store-links">
      <a href="#" id="appStoreLink">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        App Store
      </a>
      <a href="#" id="playStoreLink">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M3 20.5v-17c0-.59.34-1.11.84-1.35L13.69 12l-9.85 9.85c-.5-.24-.84-.76-.84-1.35zm13.81-5.38L6.05 21.34l8.49-8.49 2.27 2.27zm.91-.91L19.59 12l-1.87-2.21-2.27 2.27 2.27 2.15zM6.05 2.66l10.76 6.22-2.27 2.27-8.49-8.49z"/></svg>
        Google Play
      </a>
    </div>

    <div class="footer">Trimee &copy; 2025</div>
  </div>

  <script>
    // URLからtripIdを取得
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const tripId = pathParts.length >= 2 ? pathParts[1] : '';
    const memberId = pathParts.length >= 3 ? pathParts[2] : '';

    // アプリで開くリンク（同じURL — Universal Links / App Links で処理）
    document.getElementById('openApp').href = window.location.href;

    // Webで続行 — Flutter Web版にリダイレクト（#付きハッシュルーティング）
    const joinPath = memberId
      ? '/join/' + tripId + '/' + memberId
      : '/join/' + tripId;
    document.getElementById('openWeb').href = '/#' + joinPath;

    // 旅行IDコピー機能
    function copyTripId(e) {
      e.preventDefault();
      if (tripId) {
        navigator.clipboard.writeText(tripId).then(function() {
          var btn = document.getElementById('copyId');
          btn.textContent = 'コピーしました!';
          setTimeout(function() { btn.textContent = '旅行IDをコピー'; }, 2000);
        });
      }
    }

    // ストアリンクは公開後に設定
    // document.getElementById('appStoreLink').href = 'https://apps.apple.com/app/trimee/idXXXXXXXXXX';
    // document.getElementById('playStoreLink').href = 'https://play.google.com/store/apps/details?id=com.ichihos.trimee';
  </script>
</body>
</html>
